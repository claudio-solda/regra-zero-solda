<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f4d26">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Regra Zero – Qualidade Solda</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#14231a;--mut:#5b6b60;--g:#1f7a3d;--g2:#0f4d26;--gl:#e3f3e8;--bd:#d3e0d7;--red:#c62828;--amb:#e0a100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1710;--card:#14241a;--tx:#e8f2ea;--mut:#9bb0a1;--g:#3fbf6b;--g2:#1f7a3d;--gl:#183a25;--bd:#244231}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,#0f4d26,#1f7a3d);color:#fff;padding:18px 16px 14px}
header small{opacity:.8;letter-spacing:.12em;font-weight:700}
header h1{margin:2px 0 8px;font-size:28px;letter-spacing:.02em}
header h1 b{color:#8dffb0}
header p{margin:0;font-size:15px;font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pills span{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 10px;font-size:12.5px}
nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
nav button{flex:1;padding:13px 4px;border:0;background:none;color:var(--mut);font:600 14px inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g)}
main{padding:14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.rh{display:flex;align-items:center;gap:12px;padding:12px;width:100%;border:0;background:none;color:inherit;text-align:left;font:inherit}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:800}
.rh strong{flex:1;font-size:14.5px;text-transform:uppercase;letter-spacing:.01em}
.bd{display:none;padding:0 14px 12px 62px;color:var(--mut);font-size:14.5px}
.card.open .bd{display:block}
.bd li{margin:4px 0}
.mini{font-size:12px;font-weight:700;color:var(--g)}
.kpi{display:flex;gap:10px;margin-bottom:12px}
.kpi div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px;color:var(--g)}
.kpi span{font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--gl);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--bd);font-size:14.5px}
label.ck input{width:22px;height:22px;accent-color:#1f7a3d;flex:none}
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--gl);font-weight:700;font-size:13.5px;text-transform:uppercase}
.gh em{margin-left:auto;font-style:normal;color:var(--g)}
input[type=text],select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.btn{border:0;border-radius:11px;padding:12px 16px;font:700 15px inherit;background:var(--g);color:#fff;width:100%;margin-bottom:8px}
.btn.s{background:var(--gl);color:var(--g)}
.btn.d{background:none;color:var(--red);border:1px solid var(--red)}
.dv{padding:12px;border-left:5px solid var(--red)}
.dv.ok{border-color:var(--g)}
.dv small{color:var(--mut)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.empty{text-align:center;color:var(--mut);padding:24px}
h3{margin:14px 0 8px;font-size:15px}
.box{background:var(--gl);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<header>
<small>QUALIDADE SOLDA</small>
<h1>REGRA <b>ZERO</b></h1>
<p>Não aceitar, não produzir e não transferir defeitos</p>
<div class="pills"><span>Não receber peças suspeitas</span><span>Não produzir com anormalidade</span><span>Não enviar não conformes</span><span>Escalar risco imediatamente</span></div>
</header>
<nav id="nav"><button class="on" data-t="regras">Regras</button><button data-t="check">Checklist</button><button data-t="desv">Desvios</button><button data-t="gest">Gestão</button></nav>
<main id="m"></main>
<script>
const R=[
["Validar todos os parâmetros de soldagem antes da produção",["Confirmar programa, corrente, tensão, tempo e pressão","Validar setup conforme folha de processo","Aprovar a primeira peça antes da liberação"]],
["Liberar após aprovação da primeira peça",["Verificar geometria, posicionamento e quantidade dos pontos","Avaliar requisitos visuais e estruturais da solda","Registrar formalmente a aprovação"]],
["Cumprir rigorosamente o plano de controle",["Executar inspeções na frequência estabelecida","Monitorar características especiais e parâmetros críticos","Registrar resultados e reagir aos desvios"]],
["Manter eletrodos e dispositivos em condições adequadas",["Verificar desgaste dos eletrodos","Realizar dressagem conforme padrão definido","Garantir fixação correta dos componentes"]],
["Validar periodicamente a resistência da solda",["Executar testes destrutivos e não destrutivos definidos","Comparar resultados com os critérios de aprovação","Bloquear o processo em caso de reprovação"]],
["Não operar com dispositivos de segurança inoperantes",["Validar sensores, poka-yokes e sistemas de detecção","Garantir o funcionamento dos bloqueios de segurança","Interromper a operação diante de qualquer falha"]],
["Controlar e segregar produtos não conformes",["Identificar, conter e bloquear materiais suspeitos","Evitar mistura entre peças conformes e não conformes","Seguir o fluxo formal de contenção"]],
["Validar toda intervenção em equipamentos e programas",["Confirmar os parâmetros após manutenção ou ajuste","Realizar nova aprovação da primeira peça","Documentar a intervenção realizada"]],
["Controlar contaminação e manter o 5S",["Manter áreas limpas, organizadas e auditáveis","Eliminar sucatas e materiais desnecessários","Proteger peças contra oxidação, riscos e amassamentos"]],
["Entregar somente conjuntos soldados aprovados",["Garantir conformidade visual, dimensional e funcional","Confirmar integridade de todos os pontos de solda","Liberar apenas produtos aprovados pela Qualidade"]]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={checks:{},log:[],maq:"",date:new Date().toISOString().slice(0,10)},tab="regras";
try{const x=localStorage.getItem("regrazero");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("regrazero",JSON.stringify(S))}catch(e){}};
const key=()=>S.date+"|"+S.maq.trim().toLowerCase();
const ck=(r,i)=>!!S.checks[key()+"|"+r+"-"+i];
const done=r=>[0,1,2].filter(i=>ck(r,i)).length;
const total=()=>R.reduce((a,_,r)=>a+done(r),0);
const open=S.log.filter(d=>!d.ok);
function regras(){return `<div class="box">Toque em uma regra para ver os 3 pontos de verificação. Use a aba <b>Checklist</b> a cada turno.</div>`+R.map((r,i)=>`<div class="card" id="c${i}"><button class="rh" onclick="document.getElementById('c${i}').classList.toggle('open')"><span class="num">${i+1}</span><strong>${r[0]}</strong></button><ul class="bd">${r[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
function check(){const t=total(),p=Math.round(t/30*100);
return `<div class="row"><input type="text" id="maq" placeholder="Máquina (ex.: MS008)" value="${esc(S.maq)}"><input type="text" id="dt" style="max-width:150px" value="${S.date}"></div>
<div class="kpi"><div><b>${t}/30</b><span>itens verificados</span></div><div><b>${p}%</b><span>conformidade</span></div></div><div class="bar"><i style="width:${p}%"></i></div>`+
R.map((r,i)=>`<div class="card"><div class="gh"><span class="num" style="width:28px;height:28px;font-size:13px">${i+1}</span>${r[0]}<em>${done(i)}/3</em></div>${r[1].map((x,j)=>`<label class="ck"><input type="checkbox" ${ck(i,j)?"checked":""} onchange="tg(${i},${j},this.checked)">${x}</label>`).join("")}</div>`).join("")+
`<button class="btn d" onclick="clr()">Limpar checklist desta máquina/dia</button>`}
function desv(){return `<div class="card" style="padding:12px"><select id="dr">${R.map((r,i)=>`<option value="${i}">Regra ${i+1} – ${r[0]}</option>`).join("")}</select>
<input type="text" id="dm" placeholder="Máquina / posto"><textarea id="dd" rows="2" placeholder="O que aconteceu?"></textarea><textarea id="da" rows="2" placeholder="Ação de contenção tomada"></textarea>
<button class="btn" onclick="addD()">Registrar desvio</button></div>`+
(S.log.length?S.log.map((d,i)=>`<div class="card dv ${d.ok?"ok":""}"><b>Regra ${d.r+1}</b> · ${esc(d.m||"—")} <small>${d.dt}</small><div>${esc(d.d)}</div><small>Contenção: ${esc(d.a||"—")}</small><div class="row" style="margin-top:8px"><button class="btn s" onclick="fix(${i})">${d.ok?"Reabrir":"Encerrar"}</button><button class="btn d" onclick="del(${i})">Excluir</button></div></div>`).join(""):`<div class="empty">Nenhum desvio registrado.</div>`)}
function gest(){const cnt=R.map((_,i)=>S.log.filter(d=>d.r===i).length);const mx=Math.max(1,...cnt);
return `<div class="kpi"><div><b>${S.log.length}</b><span>desvios totais</span></div><div><b style="color:${open.length?"var(--red)":"var(--g)"}">${open.length}</b><span>em aberto</span></div><div><b>${Math.round(total()/30*100)}%</b><span>checklist atual</span></div></div>
<h3>Desvios por regra</h3>${R.map((r,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span class="num" style="width:28px;height:28px;font-size:13px">${i+1}</span><div class="bar" style="flex:1;margin:0"><i style="width:${cnt[i]/mx*100}%;background:${cnt[i]?"var(--amb)":"var(--g)"}"></i></div><b>${cnt[i]}</b></div>`).join("")}
<h3>Atuação do gestor</h3><div class="box">• Desvio em aberto exige contenção imediata e escalonamento.<br>• Regras 1, 2 e 8: sem primeira peça aprovada, a máquina não produz.<br>• Regras 6 e 7: falha de segurança ou peça suspeita para a linha até a Qualidade liberar.<br>• Reincidência na mesma regra pede análise de causa raiz.</div>
<button class="btn" onclick="rep()">Copiar resumo para WhatsApp</button>`}
function rep(){const t=`*REGRA ZERO – Qualidade Solda*\n${S.date} · ${S.maq||"geral"}\nChecklist: ${total()}/30 (${Math.round(total()/30*100)}%)\nDesvios abertos: ${open.length}\n`+R.map((r,i)=>`${done(i)===3?"✅":"⚠️"} ${i+1}. ${r[0]} (${done(i)}/3)`).join("\n")+(open.length?"\n\nEm aberto:\n"+open.map(d=>`- Regra ${d.r+1} (${d.m||"—"}): ${d.d}`).join("\n"):"");
if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Resumo copiado!"),()=>prompt("Copie:",t));else prompt("Copie:",t)}
function tg(r,i,v){S.checks[key()+"|"+r+"-"+i]=v;save();draw(1)}
function clr(){if(!confirm("Limpar este checklist?"))return;Object.keys(S.checks).forEach(k=>{if(k.startsWith(key()+"|"))delete S.checks[k]});save();draw()}
function addD(){const d=$("#dd").value.trim();if(!d)return alert("Descreva o desvio.");S.log.unshift({r:+$("#dr").value,m:$("#dm").value,d,a:$("#da").value,dt:new Date().toLocaleString("pt-BR"),ok:false});save();draw()}
function fix(i){S.log[i].ok=!S.log[i].ok;save();draw()}
function del(i){if(confirm("Excluir?")){S.log.splice(i,1);save();draw()}}
function draw(keep){const y=scrollY;$("#m").innerHTML={regras,check,desv,gest}[tab]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
const a=$("#maq");if(a){a.onchange=()=>{S.maq=a.value;save();draw()};$("#dt").onchange=e=>{S.date=e.target.value||S.date;save();draw()}}if(keep)scrollTo(0,y)}
$("#nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw();scrollTo(0,0)}};
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
